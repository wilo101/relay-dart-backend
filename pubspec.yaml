name: relay
description: Dart (shelf) REST backend for the Pulse and Focus Desk apps. Roles, orders, customers, webhooks, stats, focus sessions and a secure AI proxy.
publish_to: none
version: 2.0.0
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_cors_headers: ^0.1.5
  http: ^1.2.2
  crypto: ^3.0.5
dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
